[package]
name = "cc-bar"
version = "0.1.0"
edition = "2021"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "dc1cf9f00cbe2902a52166492654bb9fee8a73d1", default-features = false, features = ["applet"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "time"] }
inotify = { version = "0.11.4", features = ["stream"] }
dirs = "6.0.0"
libc = "0.2.189"
