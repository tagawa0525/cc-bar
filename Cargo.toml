[package]
name = "cc-bar"
version = "0.1.0"
edition = "2021"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", features = ["applet", "tokio", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
inotify = { version = "0.11", features = ["stream"] }
dirs = "5.0"
futures-util = "0.3"
