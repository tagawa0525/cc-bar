[package]
name = "cc-bar"
version = "0.1.0"
edition = "2021"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["applet"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["fs", "time"] }
inotify = { version = "0.11.1", features = ["stream"] }
dirs = "6.0.0"
libc = "0.2.186"
