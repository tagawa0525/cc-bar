[package]
name = "cc-bar"
version = "0.1.0"
edition = "2021"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "3e78eb238159d90956e85e95e868164671b649f6", default-features = false, features = ["applet", "tokio", "wayland", "winit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
inotify = { version = "0.11", features = ["stream"] }
dirs = "5.0"
libc = "0.2"
futures-util = "0.3"
