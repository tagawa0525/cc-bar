[package]
name = "cc-bar"
version = "0.1.0"
edition = "2021"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "430f3d48a97d8779f9c1985473912e594ccca1ae", default-features = false, features = ["applet"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["fs", "time"] }
inotify = { version = "0.11.4", features = ["stream"] }
dirs = "7.0.0"
libc = "0.2.189"
