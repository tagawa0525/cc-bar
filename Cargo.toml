[package]
name = "cc-bar"
version = "0.1.0"
edition = "2021"

[dependencies]
# libcosmic の rev を上げるときは `cargo update -p cosmic-panel-config --recursive` も実行する。
# cosmic-panel-config が libcosmic の姉妹クレートを rev なしで参照するため、別の入口として
# 古い rev のまま Cargo.lock に残り、同じクレートの別 rev が混ざる。
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "430f3d48a97d8779f9c1985473912e594ccca1ae", default-features = false, features = ["applet"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["fs", "time"] }
inotify = { version = "0.11.5", features = ["stream"] }
dirs = "7.0.0"
libc = "0.2.191"
